<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" role="img" aria-label="Hugo Salin, game developer and software engineer. Unreal Engine since 2014, C++ since 2017.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #f6f8fa; stroke: #d0d7de; }
    .name { fill: #1f2328; font-size: 46px; font-weight: 600; }
    .role { fill: #59636e; font-size: 19px; }
    .chip { fill: #ffffff; stroke: #d0d7de; }
    .chiptext { fill: #1f2328; font-size: 14px; font-weight: 500; }
    .edge { stroke: #8c959f; stroke-width: 1.5; }
    .face { fill: #0969da; opacity: 0.08; }
    .node { fill: #f6f8fa; stroke: #59636e; stroke-width: 1.5; }
    .hot { fill: #0969da; }
    .ring { fill: none; stroke: #0969da; stroke-width: 1.5; opacity: 0.35; }
    .panel { fill: #ffffff; stroke: #d0d7de; }
    .bar { stroke: #d0d7de; }
    .dot { fill: #d0d7de; }
    .file { fill: #59636e; font-size: 11.5px; }
    .code text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; fill: #1f2328; }
    .code .k { fill: #cf222e; }
    .code .f { fill: #8250df; }
    .code .t { fill: #0550ae; }
    .code .c { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .name { fill: #f0f6fc; }
      .role { fill: #9198a1; }
      .chip { fill: #161b22; stroke: #30363d; }
      .chiptext { fill: #f0f6fc; }
      .edge { stroke: #656c76; }
      .face { fill: #58a6ff; opacity: 0.1; }
      .node { fill: #0d1117; stroke: #9198a1; }
      .hot { fill: #58a6ff; }
      .ring { stroke: #58a6ff; }
      .panel { fill: #161b22; stroke: #30363d; }
      .bar { stroke: #30363d; }
      .dot { fill: #3d444d; }
      .file { fill: #9198a1; }
      .code text { fill: #f0f6fc; }
      .code .k { fill: #ff7b72; }
      .code .f { fill: #d2a8ff; }
      .code .t { fill: #79c0ff; }
      .code .c { fill: #9198a1; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="839" height="219" rx="12"/>

  <rect class="panel" x="440.5" y="20.5" width="330" height="180" rx="8"/>
  <line class="bar" x1="441" y1="44.5" x2="770" y2="44.5"/>
  <circle class="dot" cx="456" cy="32.5" r="4"/>
  <circle class="dot" cx="470" cy="32.5" r="4"/>
  <circle class="dot" cx="484" cy="32.5" r="4"/>
  <text class="file" x="605" y="36.5" text-anchor="middle">Hugo.cpp</text>
  <g class="code">
    <text x="458" y="64"><tspan class="k">void</tspan> <tspan class="t">AHugo</tspan>::<tspan class="f">Tick</tspan>(<tspan class="k">float</tspan> DeltaTime)</text>
    <text x="458" y="79">{</text>
    <text x="488" y="94"><tspan class="t">Super</tspan>::<tspan class="f">Tick</tspan>(DeltaTime);</text>
    <text x="488" y="109"><tspan class="f">MakeGames</tspan>();</text>
    <text x="488" y="129"><tspan class="k">if</tspan> (FrameTime &gt; Budget)</text>
    <text x="518" y="144"><tspan class="f">Optimize</tspan>();</text>
    <text x="488" y="159"><tspan class="k">else</tspan></text>
    <text x="518" y="174"><tspan class="f">TightenBudget</tspan>();</text>
    <text x="458" y="189">}</text>
  </g>

  <polygon class="face" points="752,110 806,100 830,142 818,190 770,204 732,166"/>
  <g>
    <polyline class="edge" fill="none" points="752,110 806,100 830,142 818,190 770,204 732,166 752,110"/>
    <line class="edge" x1="782" y1="150" x2="752" y2="110"/>
    <line class="edge" x1="782" y1="150" x2="806" y2="100"/>
    <line class="edge" x1="782" y1="150" x2="830" y2="142"/>
    <line class="edge" x1="782" y1="150" x2="818" y2="190"/>
    <line class="edge" x1="782" y1="150" x2="770" y2="204"/>
    <line class="edge" x1="782" y1="150" x2="732" y2="166"/>
  </g>
  <circle class="node" cx="752" cy="110" r="5"/>
  <circle class="node" cx="806" cy="100" r="5"/>
  <circle class="node" cx="830" cy="142" r="5"/>
  <circle class="node" cx="818" cy="190" r="5"/>
  <circle class="node" cx="770" cy="204" r="5"/>
  <circle class="node" cx="732" cy="166" r="5"/>
  <circle class="ring" cx="782" cy="150" r="13"/>
  <circle class="hot" cx="782" cy="150" r="6.5"/>

  <text class="name" x="40" y="88">Hugo Salin</text>
  <text class="role" x="41" y="122">Game developer and software engineer</text>
  <rect class="chip" x="40" y="152" width="200" height="32" rx="16"/>
  <text class="chiptext" x="140" y="173" text-anchor="middle">Unreal Engine since 2014</text>
  <rect class="chip" x="252" y="152" width="136" height="32" rx="16"/>
  <text class="chiptext" x="320" y="173" text-anchor="middle">C++ since 2017</text>
</svg>
